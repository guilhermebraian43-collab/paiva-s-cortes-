<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiva's Cortes - Agendamento</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --accent-color: #d4af37; /* Dourado Barbearia */
            --accent-hover: #b5932a;
            --text-color: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        #addressGroup {
            display: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Paiva's Cortes</h1>
            <p>Agende seu horário com praticidade</p>
        </div>

        <form id="bookingForm">
            <div class="form-group">
                <label for="service">Serviço</label>
                <select id="service" required>
                    <option value="" disabled selected>Selecione um serviço</option>
                    <option value="Corte (R$ 35,00)">Corte — R$ 35,00</option>
                    <option value="Barba (R$ 25,00)">Barba — R$ 25,00</option>
                    <option value="Corte + Barba (R$ 55,00)">Corte + Barba — R$ 55,00</option>
                </select>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="date">Data</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="time">Horário</label>
                    <input type="time" id="time" required>
                </div>
            </div>

            <div class="form-group">
                <label for="location">Local de Atendimento</label>
                <select id="location" required>
                    <option value="Na barbearia" selected>Na barbearia</option>
                    <option value="Na minha casa">Na minha casa</option>
                </select>
            </div>

            <div class="form-group" id="addressGroup">
                <label for="address">Endereço Completo</label>
                <textarea id="address" rows="2" placeholder="Rua, número, bairro e ponto de referência"></textarea>
            </div>

            <div class="form-group">
                <label for="name">Nome Completo</label>
                <input type="text" id="name" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="phone">Telefone / WhatsApp</label>
                <input type="tel" id="phone" placeholder="(94) 99999-9999" required>
            </div>

            <button type="submit" class="btn-submit">Confirmar Agendamento</button>
        </form>

        <footer>
            &copy; Paiva's Cortes. Todos os direitos reservados.
        </footer>
    </div>

    <script>
        const locationSelect = document.getElementById('location');
        const addressGroup = document.getElementById('addressGroup');
        const addressInput = document.getElementById('address');
        const bookingForm = document.getElementById('bookingForm');

        // Alternar exibição do campo de endereço com base no local escolhido
        locationSelect.addEventListener('change', function () {
            if (this.value === 'Na minha casa') {
                addressGroup.style.display = 'block';
                addressInput.setAttribute('required', 'true');
            } else {
                addressGroup.style.display = 'none';
                addressInput.removeAttribute('required');
                addressInput.value = '';
            }
        });

        // Formatação do envio do formulário para o WhatsApp
        bookingForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const service = document.getElementById('service').value;
            const dateRaw = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const location = document.getElementById('location').value;
            const address = document.getElementById('address').value;
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            // Formata a data para o padrão DD/MM/AAAA
            const dateParts = dateRaw.split('-');
            const formattedDate = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;

            // Monta a mensagem para o WhatsApp
            let message = `Olá! Gostaria de confirmar um agendamento na *Paiva's Cortes*:\n\n`;
            message += `👤 *Nome:* ${name}\n`;
            message += `📞 *Telefone:* ${phone}\n`;
            message += `✂️ *Serviço:* ${service}\n`;
            message += `📅 *Data:* ${formattedDate}\n`;
            message += `⏰ *Horário:* ${time}\n`;
            message += `📍 *Local:* ${location}\n`;

            if (location === 'Na minha casa') {
                message += `🏠 *Endereço:* ${address}\n`;
            }

            // Codifica a mensagem para URL
            const encodedMessage = encodeURIComponent(message);
            const phoneNumber = '5594991627473';

            // Abre o link do WhatsApp
            window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
        });
    </script>
</body>
</html>
